[package]
name = "council"
version = "0.2.0"
edition = "2021"
description = "A transformer written and trained from scratch that argues about your claims."
license = "MIT"
default-run = "council"

[dependencies]
anyhow = "1"
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
gemm = "0.18"            # matrix multiply (the BLAS role NumPy played): plain math, no AI
memmap2 = "0.9"
rayon = "1"              # multithreading
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
ureq = { version = "2", features = ["json", "native-certs"] }   # HTTP for the Wikipedia research loop

[target.'cfg(unix)'.dependencies]
libc = "0.2"               # only to exit quietly when output is piped into e.g. `head`

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Tests train small models, so keep them fast even in debug builds.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
